name: Update Google Trends

on:
  schedule:
    # Small rotating batches (see --max-races) instead of one all-watchlist blast.
    # Every 2h × 2 races ≈ each of 8 Current races refreshed ~3×/day when fetches succeed.
    # :20 avoids the :00 market-price bot pushes; Actions cron is UTC-only.
    - cron: "20 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Serialize bot pushes to main; rebase retries still cover PR merges mid-run.
concurrency:
  group: bot-main-pushes
  cancel-in-progress: false

jobs:
  update-trends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Google Trends interest
        # Watchlist only; 2 oldest/stale races per run. Use --all / --max-races 0
        # manually for a full refresh.
        run: python3 scripts/fetch_google_trends.py --max-races 2

      - name: Commit Trends updates
        id: commit
        if: github.ref == 'refs/heads/main'
        run: |
          bash scripts/ci/commit_and_push.sh --bump-site-rev \
            --message "chore: refresh Google Trends race interest" -- \
            data/trends.json \
            data/data_updated.json

      # GITHUB_TOKEN pushes do not start other workflows; dispatch deploy explicitly.
      - name: Deploy site to GitHub Pages
        if: github.ref == 'refs/heads/main' && steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/trigger_pages_deploy.sh main
